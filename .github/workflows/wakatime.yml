name: WakaTime Developer Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-developer-stats:
    name: Update detailed developer stats
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          # Required secrets
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # README section
          SECTION_NAME: "waka"

          # WakaTime / GitHub profile stats
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_UPDATED_DATE: "True"

          # Commit activity stats
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"

          # Weekly coding breakdown
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"

          # Repository language breakdown
          SHOW_LANGUAGE_PER_REPO: "True"

          # Keep this false if you do not want the big timeline chart
          SHOW_LOC_CHART: "False"

          # Formatting / localization
          LOCALE: "en"
          UPDATED_DATE_FORMAT: "%d/%m/%Y %H:%M:%S"

          # Repo scan controls
          MAX_REPOS: "0"
          MAX_CAP: "0"
          IGNORED_REPOS: ""

          # Badge / graph style
          BADGE_STYLE: "for-the-badge"

          # Force update if needed
          FORCE_ADD: "True"

          # Commit settings
          COMMIT_MESSAGE: "Update WakaTime developer metrics"
          COMMIT_BY_ME: "False"
          COMMIT_SINGLE: "False"
          COMMIT_USERNAME: "github-actions[bot]"
          COMMIT_EMAIL: "github-actions[bot]@users.noreply.github.com"

          # Debugging
          DEBUG_LOGGING: "False"
