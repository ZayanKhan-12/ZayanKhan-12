name: WakaTime Developer Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-developer-stats
  cancel-in-progress: true

jobs:
  update-developer-stats:
    name: Update detailed developer stats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Update README with WakaTime developer stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          SECTION_NAME: "waka"

          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_UPDATED_DATE: "True"

          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"

          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"

          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_LOC_CHART: "False"

          LOCALE: "en"
          UPDATED_DATE_FORMAT: "%d/%m/%Y %H:%M:%S"

          MAX_REPOS: "0"
          MAX_CAP: "0"
          IGNORED_REPOS: ""

          BADGE_STYLE: "for-the-badge"

          FORCE_ADD: "True"

          COMMIT_MESSAGE: "Update WakaTime developer metrics"
          COMMIT_BY_ME: "False"
          COMMIT_SINGLE: "False"
          COMMIT_USERNAME: "github-actions[bot]"
          COMMIT_EMAIL: "github-actions[bot]@users.noreply.github.com"

          DEBUG_LOGGING: "True"
