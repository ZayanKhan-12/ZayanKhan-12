name: WakaTime Developer Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime Developer Stats
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # Core WakaTime / GitHub stats
          SHOW_TITLE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_UPDATED_DATE: "True"

          # Commit/activity breakdown
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"

          # Weekly development breakdown
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "True"

          # Repo/language breakdown
          SHOW_LANGUAGE_PER_REPO: "True"

          # Extra display options
          SHOW_LOC_CHART: "True"
          SYMBOL_VERSION: "2"
          COMMIT_MESSAGE: "Update WakaTime developer metrics"
